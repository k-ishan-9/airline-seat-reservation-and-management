name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      ARMS_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/arms_test?allowPublicKeyRetrieval=true&useSSL=false
      ARMS_TEST_DB_USER: root
      ARMS_TEST_DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build, run all tests against MySQL, and package the jar
        run: mvn -B verify
