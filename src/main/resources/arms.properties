# Defaults. Every value can be overridden with an environment variable (shown in brackets).
# The defaults match docker-compose.yml, so `docker compose up -d mysql` is all you need.

# [ARMS_DB_URL] [ARMS_DB_USER] [ARMS_DB_PASSWORD]
db.url=jdbc:mysql://localhost:3306/arms?allowPublicKeyRetrieval=true&useSSL=false
db.user=arms
db.password=arms_password

# [ARMS_HOLD_MINUTES] How long seats stay held while payment is in progress
booking.holdMinutes=10

# [ARMS_HASH_ITERATIONS] PBKDF2 iterations for password hashing (OWASP guidance: 600,000 for SHA-256)
security.hashIterations=600000

# [ARMS_ADMIN_PASSWORD] Password for the seeded "admin" account on first start
seed.adminPassword=Admin@12345
